<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #30363d;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 24px;
            object-fit: cover;
            border: 2px solid #30363d;
        }

        h1 {
            font-size: 26px;
            color: #e6edf3;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links a.github {
            background: #238636;
            color: #ffffff;
        }

        .links a.github:hover {
            background: #2ea043;
        }

        .links a.email {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
        }

        .links a.email:hover {
            background: #30363d;
            color: #e6edf3;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://github.com/Xiaobaicai62106.png" class="avatar" alt="头像">
        <h1>小白</h1>
        <p class="subtitle">天地不仁，以万物为刍狗</p>

        <div class="links">
            <a href="https://github.com/Xiaobaicai62106" class="github" target="_blank">
                GitHub
            </a>
            <a href="mailto:xiaobaicai62106@outlook.com" class="email">
                发邮件
            </a>
        </div>

        <p class="footer">© 2026 小白</p>
    </div>
</body>
</html>
